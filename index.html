<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipos Pokémon</title>
  <meta name="description" content="Organiza tu equipo pokémon y el del rival: tipos, habilidades, objetos, movimientos, estadísticas y debilidades.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 16a13 13 0 0 1 26 0z' fill='%23E3350D'/%3E%3Cpath d='M3 16a13 13 0 0 0 26 0z' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2318213A' stroke-width='2.6'/%3E%3Cpath d='M3 16h26' stroke='%2318213A' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='%23fff' stroke='%2318213A' stroke-width='2.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 16a13 13 0 0 1 26 0z" fill="#E3350D"/>
          <path d="M3 16a13 13 0 0 0 26 0z" fill="#fff"/>
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.6"/>
          <path d="M3 16h26" stroke="currentColor" stroke-width="2.6"/>
          <circle cx="16" cy="16" r="4.4" fill="#fff" stroke="currentColor" stroke-width="2.6"/>
        </svg>
        <h1 class="visually-hidden">Equipos Pokémon</h1>
        <div class="tabs" id="tabs" role="tablist" aria-label="Equipos"></div>
      </div>

      <div class="search">
        <div class="combo" id="add-combo">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="add-input" type="text" aria-label="Buscar un pokémon para añadirlo" placeholder="Escribe un pokémon para añadirlo">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <ul class="combo-list"></ul>
        </div>
      </div>

      <nav class="party" id="party" aria-label="Tu equipo"></nav>

      <div class="tools">
        <button class="btn-ghost" id="btn-export" type="button" title="Descarga tu equipo en un archivo">Exportar</button>
        <button class="btn-ghost" id="btn-import" type="button" title="Carga un equipo desde un archivo exportado">Importar</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>

  <main id="team" class="team"></main>

  <footer class="credits">
    Datos e imágenes de <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>. Los equipos se guardan automáticamente en este navegador.
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/pokedata.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
